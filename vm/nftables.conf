#!/usr/sbin/nft -f
#
# Egress firewall of the sandbox VM. Managed from the Mac by `aisandbox`: edits
# made inside the VM are overwritten by the next `aisandbox up`.
#
# Policy: the VM may talk to itself (loopback, where the tunnels live) and to
# the public internet. Everything private is rejected: the Mac's LAN address,
# the LAN, VPN ranges, OrbStack's own networks, link-local.

# OrbStack's DNS resolver, as written in the VM's /etc/resolv.conf.
define DNS4 = { 0.250.250.200 }

# Create-then-delete makes this file safe to load whether or not the table
# already exists, and the whole file is applied atomically.
table inet aisandbox
delete table inet aisandbox

table inet aisandbox {
	set private4 {
		type ipv4_addr
		flags interval
		elements = {
			0.0.0.0/8,        # "this network" (OrbStack's 0.250.250.x services)
			10.0.0.0/8,       # private
			100.64.0.0/10,    # CGNAT / Tailscale
			127.0.0.0/8,      # loopback addresses leaving via a real interface
			169.254.0.0/16,   # link-local
			172.16.0.0/12,    # private
			192.168.0.0/16,   # private (LAN, OrbStack bridges)
			198.18.0.0/15,    # benchmarking, used by some VPNs
			224.0.0.0/4,      # multicast
			240.0.0.0/4       # reserved + broadcast
		}
	}

	set private6 {
		type ipv6_addr
		flags interval
		elements = {
			::1/128,          # loopback leaving via a real interface
			::ffff:0:0/96,    # IPv4-mapped
			64:ff9b::/96,     # NAT64 (could wrap a private IPv4 address)
			fc00::/7,         # unique local (OrbStack host, other machines)
			fe80::/10,        # link-local
			ff00::/8          # multicast
		}
	}

	chain output {
		type filter hook output priority filter; policy accept;

		# The VM talking to itself: tunnels, the tunnel sshd, local dev servers.
		oifname "lo" accept

		# Replies on connections that were opened from OUTSIDE (e.g. the Mac
		# reaching a dev server in the VM). "ct direction reply" is what limits
		# this to the answering side: packets of a connection the VM opened
		# itself travel in the original direction, never match here, and are
		# judged by destination below, even if the connection already existed
		# when these rules were loaded.
		ct direction reply ct state established,related accept

		# Plumbing the VM needs towards OrbStack's gateway.
		ip daddr $DNS4 meta l4proto { tcp, udp } th dport 53 accept
		udp sport 68 udp dport 67 accept
		udp sport 546 udp dport 547 accept
		icmpv6 type { nd-router-solicit, nd-neighbor-solicit, nd-neighbor-advert, mld-listener-report, mld2-listener-report } accept

		# Everything private is refused, with an immediate error instead of a hang.
		ip daddr @private4 counter meta l4proto tcp reject with tcp reset
		ip daddr @private4 counter reject with icmpx type admin-prohibited
		ip6 daddr @private6 counter meta l4proto tcp reject with tcp reset
		ip6 daddr @private6 counter reject with icmpx type admin-prohibited

		# Anything else is the public internet: allowed.
	}
}
