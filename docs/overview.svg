<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="830" viewBox="0 0 1280 830" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>What crosses between your Mac, the sandbox VM and a remote machine</title>
  <desc>Three lanes: the sandbox VM, your Mac and a remote machine. Shared folders are mounted by OrbStack at the same path in the VM as on the Mac. A tunnel carries the agent's ssh session from a port on the VM's loopback through connection B to the Mac and through connection A to the remote machine. The aisandbox tool generates the instruction file agents read in the VM. A firewall lets the VM reach the public internet and refuses the Mac, the LAN, VPNs and other machines.</desc>

  <defs>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a7f37"/></marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8250df"/></marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a6700"/></marker>
  </defs>

  <rect width="1280" height="830" fill="#ffffff"/>
  <text x="30" y="38" font-size="19" font-weight="600" fill="#1f2328">What crosses between your Mac, the sandbox VM and a remote machine</text>

  <!-- lanes -->
  <rect x="30" y="60" width="440" height="745" rx="14" fill="#eef6ff" stroke="#9cc4f5" stroke-width="1.5"/>
  <text x="52" y="92" font-size="17" font-weight="600" fill="#0a3069">Sandbox VM</text>
  <text x="52" y="111" font-size="12.5" fill="#57606a">isolated OrbStack machine, where agents run</text>

  <rect x="520" y="60" width="440" height="570" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="542" y="92" font-size="17" font-weight="600" fill="#1f2328">Your Mac</text>
  <text x="542" y="111" font-size="12.5" fill="#57606a">where aisandbox runs and your credentials stay</text>

  <rect x="1010" y="212" width="240" height="138" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="1030" y="241" font-size="17" font-weight="600" fill="#1f2328">Remote machine</text>

  <!-- 1. shared folders -->
  <text x="55" y="142" font-size="13" font-weight="700" fill="#1a7f37">Shared folders, mounted by OrbStack</text>
  <rect x="55" y="152" width="390" height="64" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.3"/>
  <text x="73" y="179" font-size="15" font-weight="600" fill="#1f2328">The same folder, at the same path</text>
  <text x="73" y="200" font-size="13" font-family="Menlo, Monaco, monospace" fill="#57606a">/Users/you/repo</text>
  <rect x="545" y="152" width="390" height="64" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.3"/>
  <text x="563" y="179" font-size="15" font-weight="600" fill="#1f2328">A folder you chose to share</text>
  <text x="563" y="200" font-size="13" font-family="Menlo, Monaco, monospace" fill="#57606a">/Users/you/repo</text>
  <line x1="453" y1="184" x2="537" y2="184" stroke="#1a7f37" stroke-width="2" marker-start="url(#a-green)" marker-end="url(#a-green)"/>

  <!-- 2. tunnels -->
  <text x="55" y="256" font-size="13" font-weight="700" fill="#8250df">Tunnels to remote machines</text>
  <rect x="55" y="266" width="390" height="64" rx="8" fill="#ffffff" stroke="#8250df" stroke-width="1.3"/>
  <text x="73" y="293" font-size="15" font-weight="600" fill="#1f2328">Agent</text>
  <text x="73" y="314" font-size="13" fill="#57606a">runs <tspan font-family="Menlo, Monaco, monospace">ssh prod</tspan></text>
  <line x1="250" y1="330" x2="250" y2="362" stroke="#8250df" stroke-width="2" marker-end="url(#a-purple)"/>
  <rect x="55" y="370" width="390" height="64" rx="8" fill="#ffffff" stroke="#8250df" stroke-width="1.3"/>
  <text x="73" y="397" font-size="15" font-weight="600" font-family="Menlo, Monaco, monospace" fill="#1f2328">127.0.0.1:2200</text>
  <text x="73" y="418" font-size="13" fill="#57606a">a port on the VM's own loopback</text>

  <line x1="445" y1="402" x2="537" y2="402" stroke="#8250df" stroke-width="2" marker-end="url(#a-purple)"/>

  <rect x="545" y="370" width="390" height="64" rx="8" fill="#ffffff" stroke="#8250df" stroke-width="1.3"/>
  <text x="563" y="397" font-size="15" font-weight="600" fill="#1f2328">B · the Mac's ssh into the VM</text>
  <text x="563" y="418" font-size="13" fill="#57606a">puts that port into the VM</text>
  <line x1="740" y1="370" x2="740" y2="338" stroke="#8250df" stroke-width="2" marker-end="url(#a-purple)"/>
  <text x="752" y="356" font-size="12" fill="#8250df">private socket file</text>
  <rect x="545" y="266" width="390" height="64" rx="8" fill="#ffffff" stroke="#8250df" stroke-width="1.3"/>
  <text x="563" y="293" font-size="15" font-weight="600" fill="#1f2328">A · your ssh login to the machine</text>
  <text x="563" y="314" font-size="13" fill="#57606a">your key and config, e.g. <tspan font-family="Menlo, Monaco, monospace" font-size="12.5">AWS_PROFILE</tspan></text>

  <line x1="935" y1="298" x2="1022" y2="298" stroke="#8250df" stroke-width="2" marker-end="url(#a-purple)"/>
  <rect x="1030" y="266" width="200" height="64" rx="8" fill="#ffffff" stroke="#8250df" stroke-width="1.3"/>
  <text x="1048" y="293" font-size="15" font-weight="600" fill="#1f2328">sshd</text>
  <text x="1048" y="314" font-size="13" fill="#57606a">accepts the VM's key</text>

  <text x="73" y="462" font-size="13" fill="#57606a">The agent's session runs end to end through B and A,</text>
  <text x="73" y="481" font-size="13" fill="#57606a">logging in with the VM's own key.</text>
  <text x="563" y="462" font-size="13" fill="#57606a">Your credentials are used for A only and never enter</text>
  <text x="563" y="481" font-size="13" fill="#57606a">the VM. Closing A or B cuts the agent off at once.</text>

  <!-- 3. what agents are told -->
  <text x="55" y="536" font-size="13" font-weight="700" fill="#9a6700">What agents are told</text>
  <rect x="55" y="546" width="390" height="64" rx="8" fill="#ffffff" stroke="#bf8700" stroke-width="1.3"/>
  <text x="73" y="573" font-size="14.5" font-weight="600" font-family="Menlo, Monaco, monospace" fill="#1f2328">/etc/claude-code/CLAUDE.md</text>
  <text x="73" y="594" font-size="13" fill="#57606a">read by Claude at the start of every session</text>
  <rect x="545" y="546" width="390" height="64" rx="8" fill="#ffffff" stroke="#bf8700" stroke-width="1.3"/>
  <text x="563" y="573" font-size="15" font-weight="600" font-family="Menlo, Monaco, monospace" fill="#1f2328">aisandbox</text>
  <text x="563" y="594" font-size="13" fill="#57606a">generates it from the tunnels, notes and shares</text>
  <line x1="545" y1="578" x2="453" y2="578" stroke="#9a6700" stroke-width="2" marker-end="url(#a-amber)"/>

  <!-- 4. what the VM cannot do -->
  <text x="55" y="664" font-size="13" font-weight="700" fill="#cf222e">What the VM can reach on its own</text>
  <rect x="55" y="674" width="390" height="110" rx="8" fill="#ffffff" stroke="#cf222e" stroke-width="1.3"/>
  <text x="73" y="703" font-size="15" font-weight="600" fill="#1f2328">Firewall, and no sudo</text>
  <text x="73" y="726" font-size="13" fill="#57606a">Installed from the Mac. The agent has no</text>
  <text x="73" y="745" font-size="13" fill="#57606a">root in the VM, so it cannot change either.</text>
  <text x="73" y="768" font-size="13" fill="#57606a">Remote machines only through tunnels.</text>

  <line x1="445" y1="698" x2="537" y2="698" stroke="#1a7f37" stroke-width="2" marker-end="url(#a-green)"/>
  <rect x="545" y="674" width="390" height="48" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.3"/>
  <text x="563" y="704" font-size="15" font-weight="600" fill="#1f2328">Public internet</text>
  <text x="917" y="704" font-size="13" font-weight="600" text-anchor="end" fill="#1a7f37">allowed</text>

  <line x1="445" y1="760" x2="512" y2="760" stroke="#cf222e" stroke-width="2"/>
  <line x1="517" y1="752" x2="533" y2="768" stroke="#cf222e" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="533" y1="752" x2="517" y2="768" stroke="#cf222e" stroke-width="2.4" stroke-linecap="round"/>
  <rect x="545" y="736" width="390" height="48" rx="8" fill="#ffffff" stroke="#cf222e" stroke-width="1.3"/>
  <text x="563" y="766" font-size="15" font-weight="600" fill="#1f2328">Your Mac, LAN, VPN, other machines</text>
  <text x="917" y="766" font-size="13" font-weight="600" text-anchor="end" fill="#cf222e">refused</text>
</svg>
